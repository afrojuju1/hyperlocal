services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hyperlocal-api
    environment:
      DATABASE_URL: postgresql+psycopg://hyperlocal:hyperlocal@db:5432/hyperlocal
      HYPERLOCAL_PERSIST_ENABLED: "1"
      HYPERLOCAL_STORAGE_ENABLED: "0"
      HYPERLOCAL_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://100.111.132.114:11434/v1
      OLLAMA_API_KEY: ollama
      HYPERLOCAL_TEXT_MODEL: qwen3:8b
      HYPERLOCAL_IMAGE_PROVIDER: comfyui_bg
      COMFYUI_API_URL: http://100.111.132.114:8188
      COMFYUI_WORKFLOW_PATH: config/comfyui_workflows/z_image_turbo_background.json
      COMFYUI_OUTPUT_NODE: "10"
      HYPERLOCAL_IMAGE_SIZE: "1024x1536"
      HYPERLOCAL_QC_ENABLED: "1"
      HYPERLOCAL_MAX_IMAGE_ATTEMPTS: "3"
    ports:
      - "18000:8000"
    volumes:
      - ./output:/app/output
    depends_on:
      db:
        condition: service_started

  creative-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hyperlocal-creative-worker
    environment:
      DATABASE_URL: postgresql+psycopg://hyperlocal:hyperlocal@db:5432/hyperlocal
      HYPERLOCAL_PERSIST_ENABLED: "1"
      HYPERLOCAL_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://100.111.132.114:11434/v1
      OLLAMA_API_KEY: ollama
      HYPERLOCAL_TEXT_MODEL: qwen3:8b
      HYPERLOCAL_IMAGE_PROVIDER: comfyui_bg
      COMFYUI_API_URL: http://100.111.132.114:8188
      COMFYUI_WORKFLOW_PATH: config/comfyui_workflows/z_image_turbo_background.json
      COMFYUI_OUTPUT_NODE: "10"
      HYPERLOCAL_IMAGE_SIZE: "1024x1536"
      HYPERLOCAL_QC_ENABLED: "1"
      HYPERLOCAL_MAX_IMAGE_ATTEMPTS: "3"
      HYPERLOCAL_CREATIVE_RUN_POLL_INTERVAL: "2"
      HYPERLOCAL_CREATIVE_RUN_MAX_CONCURRENT: "1"
    command: ["uv", "run", "scripts/run_creative_worker.py"]
    volumes:
      - ./output:/app/output
    depends_on:
      db:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hyperlocal-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18000
    ports:
      - "13000:3000"
    depends_on:
      - api

  db:
    image: postgres:16
    container_name: hyperlocal-postgres
    environment:
      POSTGRES_USER: hyperlocal
      POSTGRES_PASSWORD: hyperlocal
      POSTGRES_DB: hyperlocal
    ports:
      - "55432:5432"
    volumes:
      - hyperlocal_pgdata:/var/lib/postgresql/data

volumes:
  hyperlocal_pgdata:
